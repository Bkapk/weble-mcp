name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you asked the agent to do, what it did, and the exact error it got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Weble MCP 1.0.0, WordPress 7.1, PHP 8.3, Elementor 3.x / Pro 3.x
    validations:
      required: true
  - type: markdown
    attributes:
      value: Security issues go by email to info@weble.studio, not here.
